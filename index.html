<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <!-- Native iOS PWA behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-card {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* Views management */
        .page { display: none; }
        .page.active { display: block; }

        /* Explore Page Styles */
        h1.header-title {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: #1db954;
            text-align: center;
        }
        .playlist-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .playlist-card-btn {
            background-color: #282828;
            border: 1px solid #333;
            color: #ffffff;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .playlist-card-btn:active { background-color: #333; }
        .playlist-card-btn span { color: #1db954; font-size: 0.85rem; }

        /* Playlist Page Styles */
        .top-bar {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }
        .back-btn {
            background: #282828;
            border: none;
            color: #1db954;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .playlist-title {
            flex-grow: 1;
            text-align: center;
            font-size: 1.2rem;
            margin: 0;
            padding-right: 50px; /* Offset for back button alignment */
        }
        
        .now-playing {
            text-align: center;
            margin-bottom: 20px;
        }
        .now-playing h3 { font-size: 0.8rem; color: #a7a7a7; margin-bottom: 4px; letter-spacing: 1px; }
        .now-playing h2 { font-size: 1.3rem; margin: 0; color: #ffffff; }

        audio { width: 100%; margin-bottom: 16px; }

        /* Controls */
        .controls-row {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .mode-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .mode-btn.active { background-color: #1db954; color: #000; }

        /* Tracklist */
        .tracklist {
            background: #282828;
            border-radius: 12px;
            overflow: hidden;
            max-height: 250px;
            overflow-y: auto;
        }
        .track-item {
            padding: 12px 16px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .track-item:last-child { border-bottom: none; }
        .track-item.playing { color: #1db954; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-card">

    <!-- PAGE 1: EXPLORE PAGE -->
    <div id="explore-page" class="page active">
        <h1 class="header-title">Explore Playlists</h1>
        <div id="explore-buttons" class="playlist-buttons">
            <!-- Playlist buttons generated by JS -->
        </div>
    </div>

    <!-- PAGE 2: PLAYLIST PAGE -->
    <div id="playlist-page" class="page">
        <div class="top-bar">
            <button class="back-btn" onclick="showExplorePage()">← Explore</button>
            <h2 id="current-playlist-name" class="playlist-title">Playlist</h2>
        </div>

        <div class="now-playing">
            <h3>NOW PLAYING</h3>
            <h2 id="track-title">Select a Track</h2>
        </div>

        <audio id="audio-player" controls></audio>

        <div class="controls-row">
            <button id="mode-btn" class="mode-btn" onclick="cyclePlayMode()">Mode: Single</button>
        </div>

        <div id="tracklist-container" class="tracklist">
            <!-- Track items generated by JS -->
        </div>
    </div>

</div>

<script>
    // =========================================================================
    // 1. MASTER SONG LIBRARY (Define each song once with a unique numerical ID)
    // =========================================================================
    const songLibrary = [
        { id: 1, title: "Song One", file: "song1.mp3" },
        { id: 2, title: "Song Two", file: "song2.mp3" },
        { id: 3, title: "Song Three", file: "song3.mp3" },
        { id: 4, title: "Song Four", file: "song4.mp3" }
    ];

    // =========================================================================
    // 2. PLAYLIST DEFINITIONS (Strictly mapped using song IDs)
    // =========================================================================
    const playlists = [
        {
            id: "pl_favorites",
            name: "Favorites",
            songIds: [1, 2, 3] // Uses IDs 1, 2, and 3
        },
        {
            id: "pl_chill",
            name: "Chill Vibe",
            songIds: [2, 4]    // Uses IDs 2 and 4
        },
        {
            id: "pl_workout",
            name: "Workout Mix",
            songIds: [1, 3, 4] // Uses IDs 1, 3, and 4
        }
    ];

    // =========================================================================
    // 3. APP STATE & PLAYBACK LOGIC
    // =========================================================================
    // Play Modes: 0 = "Single", 1 = "Single Loop", 2 = "Playlist", 3 = "Playlist Loop"
    const MODES = [
        { name: "Single", label: "▶ Mode: Single" },
        { name: "Single Loop", label: "🔂 Mode: Single Loop" },
        { name: "Playlist", label: "➡️ Mode: Playlist" },
        { name: "Playlist Loop", label: "🔁 Mode: Playlist Loop" }
    ];
    
    let currentModeIndex = 0; // Starts at "Single"
    let activePlaylist = null;
    let currentTrackIndex = 0;

    // DOM Elements
    const explorePage = document.getElementById("explore-page");
    const playlistPage = document.getElementById("playlist-page");
    const exploreButtons = document.getElementById("explore-buttons");
    const playlistTitleEl = document.getElementById("current-playlist-name");
    const trackTitleEl = document.getElementById("track-title");
    const tracklistContainer = document.getElementById("tracklist-container");
    const audio = document.getElementById("audio-player");
    const modeBtn = document.getElementById("mode-btn");

    // Helper: Find song details by ID
    function getSongById(id) {
        return songLibrary.find(song => song.id === id);
    }

    // Render Explore Page
    function initExplorePage() {
        exploreButtons.innerHTML = "";
        playlists.forEach(pl => {
            const btn = document.createElement("button");
            btn.className = "playlist-card-btn";
            btn.innerHTML = `${pl.name} <span>${pl.songIds.length} tracks ›</span>`;
            btn.onclick = () => openPlaylist(pl.id);
            exploreButtons.appendChild(btn);
        });
    }

    // Navigation: Show Explore Page
    function showExplorePage() {
        playlistPage.classList.remove("active");
        explorePage.classList.add("active");
    }

    // Navigation: Open Playlist Page
    function openPlaylist(playlistId) {
        activePlaylist = playlists.find(p => p.id === playlistId);
        if (!activePlaylist) return;

        playlistTitleEl.innerText = activePlaylist.name;
        renderTracklist();

        explorePage.classList.remove("active");
        playlistPage.classList.add("active");

        // Load first track of the playlist if not already loaded
        if (activePlaylist.songIds.length > 0) {
            loadTrack(0, false);
        }
    }

    // Render the song list for the open playlist
    function renderTracklist() {
        tracklistContainer.innerHTML = "";
        activePlaylist.songIds.forEach((songId, index) => {
            const song = getSongById(songId);
            if (!song) return;

            const item = document.createElement("div");
            item.className = `track-item ${index === currentTrackIndex ? 'playing' : ''}`;
            item.innerText = `${index + 1}. ${song.title}`;
            item.onclick = () => {
                loadTrack(index, true);
            };
            tracklistContainer.appendChild(item);
        });
    }

    // Load and optionally play a track by index within the current playlist
    function loadTrack(index, shouldPlay = false) {
        currentTrackIndex = index;
        const songId = activePlaylist.songIds[currentTrackIndex];
        const song = getSongById(songId);

        if (!song) return;

        audio.src = song.file;
        trackTitleEl.innerText = song.title;

        // Highlight active track
        renderTracklist();

        if (shouldPlay) {
            audio.play().catch(e => console.log("User interaction required for playback"));
        }
    }

    // Mode Toggle Logic
    function cyclePlayMode() {
        currentModeIndex = (currentModeIndex + 1) % MODES.length;
        updateModeButtonUI();
    }

    function updateModeButtonUI() {
        modeBtn.innerText = MODES[currentModeIndex].label;
        if (currentModeIndex > 0) {
            modeBtn.classList.add("active");
        } else {
            modeBtn.classList.remove("active");
        }
    }

    // =========================================================================
    // 4. AUTOMATIC TRACK CONTINUATION (Handles end of song based on 4 Modes)
    // =========================================================================
    audio.onended = function() {
        const mode = MODES[currentModeIndex].name;

        if (mode === "Single") {
            // Mode 1: Stop playing when track finishes
            audio.currentTime = 0;
        } 
        else if (mode === "Single Loop") {
            // Mode 2: Loop current track indefinitely
            audio.currentTime = 0;
            audio.play();
        } 
        else if (mode === "Playlist") {
            // Mode 3: Play next song, stop at the end of playlist
            if (currentTrackIndex < activePlaylist.songIds.length - 1) {
                loadTrack(currentTrackIndex + 1, true);
            }
        } 
        else if (mode === "Playlist Loop") {
            // Mode 4: Play next song, loop back to start when last song finishes
            const nextIndex = (currentTrackIndex + 1) % activePlaylist.songIds.length;
            loadTrack(nextIndex, true);
        }
    };

    // Initialize App
    initExplorePage();
    updateModeButtonUI();
</script>

</body>
</html>
