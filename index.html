<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="apple-touch-icon" href="images/icon.jpg">

    <!-- Native iOS PWA behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px 20px 0 20px;
            box-sizing: border-box;
        }
        .app-card {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            padding-bottom: 40px;
            border-radius: 10px 10px 0 0;
            min-height: calc(100vh - 20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            position: relative;
            box-sizing: border-box;
        }

        /* Views management */
        .page { display: none; }
        .page.active { display: block; }

        /* Explore Page Styles */
        h1.header-title {
            font-family: "Biwa Display Bold", "Biwa Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 2.25rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 800;
            background: radial-gradient(circle at 25% 25%, #d149a4 0%, #e0c946 55%, #5499db 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        /* Centered Header Lines for Sections */
        .section-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #a7a7a7;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 20px 0 12px 0;
        }
        .section-divider:first-child {
            margin-top: 0;
        }
        .section-divider::before,
        .section-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333;
        }
        .section-divider::before {
            margin-right: 12px;
        }
        .section-divider::after {
            margin-left: 12px;
        }

        .section-divider:empty::before {
            margin-right: 0;
        }
        .section-divider:empty::after {
            margin-left: 0;
        }

        /* Golden Yellow Special Header Divider */
        .section-divider.special {
            color: #ffd700;
        }
        .section-divider.special::before,
        .section-divider.special::after {
            border-bottom-color: #ffd700;
        }

        /* Footer Copyright Text */
        .copyright-text {
            text-align: center;
            color: #666666;
            font-size: 0.75rem;
            margin-top: 12px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .playlist-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .playlist-card-btn {
            position: relative;
            overflow: hidden;
            background-color: #282828;
            border: 1px solid #333;
            color: #ffffff;
            padding: 14px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s, transform 0.1s;
        }
        .playlist-card-btn:active { 
            background-color: #333; 
            transform: scale(0.99);
        }

        .playlist-card-btn > * {
            position: relative;
            z-index: 2;
        }

        /* Inverted Trapezium Background Mask */
        .playlist-bg {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            clip-path: polygon(0 0, 70% 0, 58% 100%, 0 100%);
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .playlist-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, rgba(18, 18, 18, 0.75) 0%, rgba(18, 18, 18, 0.25) 100%);
        }

        .playlist-card-btn span { color: #1db954; font-size: 0.85rem; }

        .playlist-card-btn.special-btn span {
            color: #ffd700;
        }

        /* Playlist Page Styles */
        .top-bar {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            min-height: 36px;
        }
        .back-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: #282828;
            border: none;
            color: #1db954;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            z-index: 10;
        }
        .playlist-title {
            text-align: center;
            font-size: 1.2rem;
            margin: 0;
            width: 100%;
        }
        
        .now-playing {
            text-align: center;
            margin-bottom: 20px;
        }
        .now-playing h3 { font-size: 0.8rem; color: #a7a7a7; margin-bottom: 4px; letter-spacing: 1px; }
        .now-playing h2 { font-size: 1.3rem; margin: 0; color: #ffffff; }

        audio { width: 100%; margin-bottom: 16px; }

        /* Controls */
        .controls-row {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .mode-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        /* Tracklist */
        .tracklist {
            background: #282828;
            border-radius: 6px;
            overflow: hidden;
            max-height: 250px;
            overflow-y: auto;
        }
        .track-item {
            padding: 10px 16px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .track-item:last-child { border-bottom: none; }
        .track-name {
            font-size: 0.95rem;
            color: #ffffff;
        }
        .track-item.playing .track-name {
            color: #1db954;
            font-weight: bold;
        }
        .track-artist {
            font-size: 0.8rem;
            color: #a7a7a7;
            font-weight: normal;
        }
    </style>
</head>

                    btn.innerHTML = `
                        ${bgHTML}
                        <div>${pl.name}</div>
                        <span>${pl.songIds.length} tracks ›</span>
                    `;
                    
                    btn.onclick = () => openPlaylist(pl.id);
                    exploreButtons.appendChild(btn);
                });
            }
        });

        const bottomDivider = document.createElement("div");
        bottomDivider.className = "section-divider";
        exploreButtons.appendChild(bottomDivider);

        const copyrightEl = document.createElement("div");
        copyrightEl.className = "copyright-text";
        copyrightEl.innerText = "© 2026 ballisticdevlpr. All rights reserved.";
        exploreButtons.appendChild(copyrightEl);
    }

    function showExplorePage() {
        playlistPage.classList.remove("active");
        explorePage.classList.add("active");
        resetScrollPosition();
    }

    function openPlaylist(playlistId) {
        activePlaylist = playlists.find(p => p.id === playlistId);
        if (!activePlaylist) return;

        playlistTitleEl.innerText = activePlaylist.name;
        renderTracklist();

        explorePage.classList.remove("active");
        playlistPage.classList.add("active");
        
        resetScrollPosition();

        if (activePlaylist.songIds.length > 0) {
            loadTrack(0, false);
        }
    }

    function renderTracklist() {
        tracklistContainer.innerHTML = "";
        activePlaylist.songIds.forEach((songId, index) => {
            const song = getSongById(songId);
            if (!song) return;

            const item = document.createElement("div");
            item.className = `track-item ${index === currentTrackIndex ? 'playing' : ''}`;
            item.innerHTML = `
                <div class="track-name">${index + 1}. ${song.title}</div>
                <div class="track-artist">${song.artist || "Unknown Artist"}</div>
            `;
            item.onclick = () => loadTrack(index, true);
            tracklistContainer.appendChild(item);
        });
    }

    function loadTrack(index, shouldPlay = false) {
        currentTrackIndex = index;
        const songId = activePlaylist.songIds[currentTrackIndex];
        const song = getSongById(songId);

        if (!song) return;

        audio.src = song.file;
        trackTitleEl.innerText = song.title;

        renderTracklist();

        if (shouldPlay) {
            audio.play().catch(e => console.log("User interaction required for playback"));
        }
    }

    function cyclePlayMode() {
        currentModeIndex = (currentModeIndex + 1) % MODES.length;
        updateModeButtonUI();
    }

    function updateModeButtonUI() {
        modeBtn.innerText = MODES[currentModeIndex].label;
    }

    audio.onended = function() {
        const mode = MODES[currentModeIndex].name;

        if (mode === "Single") {
            audio.currentTime = 0;
        } 
        else if (mode === "Single Loop") {
            audio.currentTime = 0;
            audio.play();
        } 
        else if (mode === "Playlist") {
            if (currentTrackIndex < activePlaylist.songIds.length - 1) {
                loadTrack(currentTrackIndex + 1, true);
            }
        } 
        else if (mode === "Playlist Loop") {
            const nextIndex = (currentTrackIndex + 1) % activePlaylist.songIds.length;
            loadTrack(nextIndex, true);
        }
    };

    initExplorePage();
    updateModeButtonUI();
</script>

</body>
</html>
