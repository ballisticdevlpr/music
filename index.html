<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <!-- Native iOS PWA behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-card {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* Views management */
        .page { display: none; }
        .page.active { display: block; }

        /* Explore Page Styles */
        h1.header-title {
            font-size: 2.25rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 800;
            /* Non-linear radial gradient */
            background: radial-gradient(circle at 25% 25%, #d149a4 0%, #e0c946 55%, #5499db 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        /* Centered Header Lines for Sections */
        .section-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #a7a7a7;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 20px 0 12px 0;
        }
        .section-divider:first-child {
            margin-top: 0;
        }
        .section-divider::before,
        .section-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333;
        }
        .section-divider::before {
            margin-right: 12px;
        }
        .section-divider::after {
            margin-left: 12px;
        }

        /* Golden Yellow Special Header Divider */
        .section-divider.special {
            color: #ffd700;
        }
        .section-divider.special::before,
        .section-divider.special::after {
            border-bottom-color: #ffd700;
        }

        .playlist-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .playlist-card-btn {
            position: relative;
            overflow: hidden; /* Keeps trapezium mask within rounded corners */
            background-color: #282828;
            border: 1px solid #333;
            color: #ffffff;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s, transform 0.1s;
        }
        .playlist-card-btn:active { 
            background-color: #333; 
            transform: scale(0.99);
        }

        /* Elevate button content above the background image */
        .playlist-card-btn > * {
            position: relative;
            z-index: 2;
        }

        /* Inverted Trapezium Background Mask */
        .playlist-bg {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            /* Top edge covers ~52%, bottom edge slants inward to ~38% */
            clip-path: polygon(0 0, 52% 0, 38% 100%, 0 100%);
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Dark overlay gradient to ensure left text remains readable */
        .playlist-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, rgba(18, 18, 18, 0.75) 0%, rgba(18, 18, 18, 0.25) 100%);
        }

        .playlist-card-btn span { color: #1db954; font-size: 0.85rem; }

        /* Golden Yellow Track Count for Special Playlists */
        .playlist-card-btn.special-btn span {
            color: #ffd700;
        }

        /* Playlist Page Styles */
        .top-bar {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            min-height: 36px;
        }
        .back-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: #282828;
            border: none;
            color: #1db954;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            z-index: 10;
        }
        .playlist-title {
            text-align: center;
            font-size: 1.2rem;
            margin: 0;
            width: 100%;
        }
        
        .now-playing {
            text-align: center;
            margin-bottom: 20px;
        }
        .now-playing h3 { font-size: 0.8rem; color: #a7a7a7; margin-bottom: 4px; letter-spacing: 1px; }
        .now-playing h2 { font-size: 1.3rem; margin: 0; color: #ffffff; }

        audio { width: 100%; margin-bottom: 16px; }

        /* Controls */
        .controls-row {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .mode-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        /* Tracklist */
        .tracklist {
            background: #282828;
            border-radius: 12px;
            overflow: hidden;
            max-height: 250px;
            overflow-y: auto;
        }
        .track-item {
            padding: 12px 16px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .track-item:last-child { border-bottom: none; }
        .track-item.playing { color: #1db954; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-card">

    <!-- PAGE 1: EXPLORE PAGE -->
    <div id="explore-page" class="page active">
        <h1 class="header-title">Explore</h1>
        <div id="explore-buttons" class="playlist-buttons">
            <!-- Playlist sections generated by JS -->
        </div>
    </div>

    <!-- PAGE 2: PLAYLIST PAGE -->
    <div id="playlist-page" class="page">
        <div class="top-bar">
            <button class="back-btn" onclick="showExplorePage()">← Explore</button>
            <h2 id="current-playlist-name" class="playlist-title">Playlist</h2>
        </div>

        <div class="now-playing">
            <h3>NOW PLAYING</h3>
            <h2 id="track-title">Select a Track</h2>
        </div>

        <audio id="audio-player" controls></audio>

        <div class="controls-row">
            <button id="mode-btn" class="mode-btn" onclick="cyclePlayMode()">▶ Mode: Single</button>
        </div>

        <div id="tracklist-container" class="tracklist">
            <!-- Track items generated by JS -->
        </div>
    </div>

</div>

<script>
    // =========================================================================
    // 1. MASTER SONG LIBRARY (Define each song once with a unique numerical ID)
    // =========================================================================
    const songLibrary = [
        { id: 1, title: "Song One", file: "song1.mp3" },
        { id: 2, title: "Song Two", file: "song2.mp3" },
        { id: 3, title: "Song Three", file: "song3.mp3" },
        { id: 4, title: "Song Four", file: "song4.mp3" }
    ];

    // =========================================================================
    // 2. PLAYLIST DEFINITIONS (Add your image filenames here)
    // =========================================================================
    const playlists = [
        // Regular Playlists
        {
            id: "pl_phonk",
            name: "Phonk",
            category: "regular",
            image: "phonk.jpg",
            songIds: [1, 2, 3]
        },
        {
            id: "pl_aggressive",
            name: "Aggressive",
            category: "regular",
            image: "aggressive.jpg",
            songIds: [1, 2, 3]
        },
        {
            id: "pl_hardstyle",
            name: "Gym Hardstyle",
            category: "regular",
            image: "hardstyle.jpg",
            songIds: [2, 4]
        },
        {
            id: "pl_pop",
            name: "Pop",
            category: "regular",
            image: "pop.jpg",
            songIds: [2, 4]
        },
        {
            id: "pl_lofi",
            name: "Lofi",
            category: "regular",
            image: "lofi.jpg",
            songIds: [2, 4]
        },
        // Artist Playlists
        {
            id: "pl_tommacdonald",
            name: "Tom Macdonald",
            category: "artists",
            image: "tommacdonald.jpg",
            songIds: [1, 3]
        },
        {
            id: "pl_elvispresley",
            name: "Elvis Presley",
            category: "artists",
            image: "elvispresley.jpg",
            songIds: [2, 4]
        },
        {
            id: "pl_goggins",
            name: "David Goggins",
            category: "artists",
            image: "goggins.jpg",
            songIds: [2, 4]
        },
        // Special Playlists
        {
            id: "pl_rocky",
            name: "Rocky",
            category: "special",
            image: "rocky.jpg",
            songIds: [1, 3, 4]
        },
        {
            id: "pl_myway",
            name: "My Way",
            category: "special",
            image: "myway.jpg",
            songIds: [1, 3, 4]
        },
        {
            id: "pl_gangsta",
            name: "Gangsta's Paradise",
            category: "special",
            image: "gangsta.jpg",
            songIds: [1, 3, 4]
        }
    ];

    // =========================================================================
    // 3. APP STATE & PLAYBACK LOGIC
    // =========================================================================
    const MODES = [
        { name: "Single", label: "▶ Mode: Single" },
        { name: "Single Loop", label: "▶ Mode: Single Loop" },
        { name: "Playlist", label: "▶ Mode: Playlist" },
        { name: "Playlist Loop", label: "▶ Mode: Playlist Loop" }
    ];
    
    let currentModeIndex = 0;
    let activePlaylist = null;
    let currentTrackIndex = 0;

    // DOM Elements
    const explorePage = document.getElementById("explore-page");
    const playlistPage = document.getElementById("playlist-page");
    const exploreButtons = document.getElementById("explore-buttons");
    const playlistTitleEl = document.getElementById("current-playlist-name");
    const trackTitleEl = document.getElementById("track-title");
    const tracklistContainer = document.getElementById("tracklist-container");
    const audio = document.getElementById("audio-player");
    const modeBtn = document.getElementById("mode-btn");

    function getSongById(id) {
        return songLibrary.find(song => song.id === id);
    }

    // Render Explore Page with categorized header lines & trapezium background images
    function initExplorePage() {
        exploreButtons.innerHTML = "";

        const categories = [
            { key: "regular", label: "Regular" },
            { key: "artists", label: "Artists" },
            { key: "special", label: "Special" }
        ];

        categories.forEach(cat => {
            const catPlaylists = playlists.filter(p => p.category === cat.key);

            if (catPlaylists.length > 0) {
                // Render Section Divider Header Line
                const divider = document.createElement("div");
                const isSpecial = cat.key === "special";
                
                divider.className = `section-divider ${isSpecial ? 'special' : ''}`;
                divider.innerText = isSpecial ? `◆ ${cat.label} ◆` : cat.label;
                exploreButtons.appendChild(divider);

                // Render Playlists under this section
                catPlaylists.forEach(pl => {
                    const btn = document.createElement("button");
                    btn.className = `playlist-card-btn ${isSpecial ? 'special-btn' : ''}`;

                    // Insert trapezium background image if specified
                    let bgHTML = "";
                    if (pl.image) {
                        bgHTML = `<div class="playlist-bg" style="background-image: url('${pl.image}');"></div>`;
                    }

                    btn.innerHTML = `
                        ${bgHTML}
                        <div>${pl.name}</div>
                        <span>${pl.songIds.length} tracks ›</span>
                    `;
                    
                    btn.onclick = () => openPlaylist(pl.id);
                    exploreButtons.appendChild(btn);
                });
            }
        });
    }

    // Navigation: Show Explore Page
    function showExplorePage() {
        playlistPage.classList.remove("active");
        explorePage.classList.add("active");
    }

    // Navigation: Open Playlist Page
    function openPlaylist(playlistId) {
        activePlaylist = playlists.find(p => p.id === playlistId);
        if (!activePlaylist) return;

        playlistTitleEl.innerText = activePlaylist.name;
        renderTracklist();

        explorePage.classList.remove("active");
        playlistPage.classList.add("active");

        if (activePlaylist.songIds.length > 0) {
            loadTrack(0, false);
        }
    }

    function renderTracklist() {
        tracklistContainer.innerHTML = "";
        activePlaylist.songIds.forEach((songId, index) => {
            const song = getSongById(songId);
            if (!song) return;

            const item = document.createElement("div");
            item.className = `track-item ${index === currentTrackIndex ? 'playing' : ''}`;
            item.innerText = `${index + 1}. ${song.title}`;
            item.onclick = () => loadTrack(index, true);
            tracklistContainer.appendChild(item);
        });
    }

    function loadTrack(index, shouldPlay = false) {
        currentTrackIndex = index;
        const songId = activePlaylist.songIds[currentTrackIndex];
        const song = getSongById(songId);

        if (!song) return;

        audio.src = song.file;
        trackTitleEl.innerText = song.title;

        renderTracklist();

        if (shouldPlay) {
            audio.play().catch(e => console.log("User interaction required for playback"));
        }
    }

    function cyclePlayMode() {
        currentModeIndex = (currentModeIndex + 1) % MODES.length;
        updateModeButtonUI();
    }

    function updateModeButtonUI() {
        modeBtn.innerText = MODES[currentModeIndex].label;
    }

    // Automatic track progression logic
    audio.onended = function() {
        const mode = MODES[currentModeIndex].name;

        if (mode === "Single") {
            audio.currentTime = 0;
        } 
        else if (mode === "Single Loop") {
            audio.currentTime = 0;
            audio.play();
        } 
        else if (mode === "Playlist") {
            if (currentTrackIndex < activePlaylist.songIds.length - 1) {
                loadTrack(currentTrackIndex + 1, true);
            }
        } 
        else if (mode === "Playlist Loop") {
            const nextIndex = (currentTrackIndex + 1) % activePlaylist.songIds.length;
            loadTrack(nextIndex, true);
        }
    };

    // Initialize App
    initExplorePage();
    updateModeButtonUI();
</script>

</body>
</html>
